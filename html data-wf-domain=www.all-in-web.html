document.addEventListener("DOMContentLoaded", () => {
  const wrapper = document.querySelector(".hero_ani_image_wrapper");
  if (!wrapper) return;

  const images = gsap.utils.toArray(".hero_ani_image_absolute", wrapper);
  if (images.length === 0) return;

  // ⚙️ 컷 간격 (초)
  const HOLD = 0.75;

  // 초기 상태: 전부 숨김
  gsap.set(images, { opacity: 0 });

  // 무한 필름 컷 루프
  const tl = gsap.timeline({ repeat: -1 });

  images.forEach((img, i) => {
    tl.set(img, { opacity: 1 }, i * HOLD)
      .set(img, { opacity: 0 }, (i + 1) * HOLD);
  });
});
</script></div></div></div></div></div></div></div><div data-wf--spacer--variant="main" class="u-section-spacer w-variant-60a7ad7d-02b0-6682-95a5-2218e6fd1490 u-ignore-trim"></div></section></div><script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=69c0f5b21a9e72b44b19b3dc" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/69c0f5b21a9e72b44b19b3dc/js/webflow.schunk.c42549641b7d4501.js" type="text/javascript" integrity="sha384-EeGd0MuCSKO1a60JtC5HSnHq/C4KrtHuH4qImMGUQIlIox5ZJ0y/b+zo9WWvnaty" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/69c0f5b21a9e72b44b19b3dc/js/webflow.schunk.db00d60c8de59c99.js" type="text/javascript" integrity="sha384-GnNYb69QR3a0fre5ZNclurvGoufprgl/HJexbIQbjbAKekYgYNstBqoPSdCCPQEG" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/69c0f5b21a9e72b44b19b3dc/js/webflow.bedfc2e2.5c53b105e80f2a02.js" type="text/javascript" integrity="sha384-TPCT/MOv3SdK/Xm7//qyNEEAJkIQ7ZSmndIQcWdUyRB67FgJWMoubA6fdjthybUt" crossorigin="anonymous"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/gsap.min.js" type="text/javascript"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/ScrollTrigger.min.js" type="text/javascript"></script><script src="https://cdn.prod.website-files.com/gsap/3.15.0/Flip.min.js" type="text/javascript"></script><script>
document.addEventListener("DOMContentLoaded", () => {
  const overlay = document.querySelector("[data-intro-overlay]");
  const stage   = document.querySelector("[data-intro-stage]");
  const wrapper = document.querySelector(".hero_ani_image_wrapper");
  const innerEl = document.querySelector(".hero_ani_inner");
  const reduce  = matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!overlay || !wrapper || !innerEl || reduce /* || sessionStorage.getItem("allinweb_intro_played") */) {
    overlay && overlay.classList.add("is-hidden");
    console.warn("[intro] skipped", { overlay: !!overlay, wrapper: !!wrapper, innerEl: !!innerEl, reduce });
    return;
  }
  // sessionStorage.setItem("allinweb_intro_played", "1"); // TEMP: disabled for local testing

  if (typeof gsap === "undefined" || typeof Flip === "undefined") {
    overlay.classList.add("is-hidden");
    console.warn("[intro] GSAP or Flip not loaded", { gsap: typeof gsap, Flip: typeof Flip });
    return;
  }
  gsap.registerPlugin(Flip);

  const endState = Flip.getState(wrapper);
  stage.appendChild(wrapper);
  Flip.from(endState, { duration: 0, scale: true });

  gsap.delayedCall(2.5, () => {
    const startState = Flip.getState(wrapper);
    innerEl.appendChild(wrapper);
    Flip.from(startState, {
      duration: 1.1,
      ease: "power3.inOut",
      scale: true,
      absolute: true,
      onStart: () => {
        gsap.to(overlay, {
          autoAlpha: 0,
          duration: 1.0,
          ease: "power2.out",
          onComplete: () => overlay.classList.add("is-hidden")
        });
      }
    });
  });
});
</script><script>
